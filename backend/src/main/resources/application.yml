spring:
  application:
    name: shopirend-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopirend}
    username: ${DB_USERNAME:shopirend}
    password: ${DB_PASSWORD:shopirend}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-please}
    expiration-minutes: 10080
  fcm:
    enabled: ${FCM_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info

