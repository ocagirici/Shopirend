services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopirend
      POSTGRES_USER: shopirend
      POSTGRES_PASSWORD: shopirend
    ports:
      - "5433:5432"
    volumes:
      - shopirend_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopirend -d shopirend"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shopirend_postgres:
